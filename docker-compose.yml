# Self-hosted stack: web + api + PostgreSQL + Redis + MinIO.
# 1. cp .env.example .env and set ENCRYPTION_KEY, URL_SIGNING_SECRET, POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD
# 2. docker compose up -d --build
# 3. docker compose run --rm migrate          (migrations + RLS + first-run seed)

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/lms
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:3000}
  DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-default}
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  SAAS_MODE: ${SAAS_MODE:-false}
  TRUST_PROXY: "true"
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  URL_SIGNING_SECRET: ${URL_SIGNING_SECRET:?set URL_SIGNING_SECRET}
  STORAGE_DRIVER: minio
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: lms
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lms}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  ALLOW_PRIVATE_STORAGE_ENDPOINTS: "true"
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-LMS <no-reply@localhost>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_URL: http://api:4000 } }
    ports: ["3000:3000"]
    environment:
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    command: sh -c "cd packages/db && npx tsx src/migrate.ts && npx tsx src/seed.ts"
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-lms} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/lms && mc anonymous set none local/lms"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

volumes:
  pgdata:
  redisdata:
  miniodata:
